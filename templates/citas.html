{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
    <h2 style="margin:0;">Gestión de Citas</h2>
    <button id="btn-nuevo-cita" class="btn btn-success">+ Nueva cita</button>
</div>

<div id="citas-list"></div>

<!-- ============================================================ -->
<!-- MODAL para crear/editar cita -->
<!-- ============================================================ -->
<div id="modal-cita" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center; overflow-y:auto;">
    <div style="background:white; border-radius:12px; padding:30px; max-width:600px; width:90%; margin:20px auto; box-shadow:0 10px 30px rgba(0,0,0,0.3); max-height:90vh; overflow-y:auto;">
        <h3 id="modal-titulo-cita" style="margin-top:0; color:#1a3e60;">Nueva Cita</h3>
        <form id="form-cita">
            <input type="hidden" name="_id" id="cita-id">
            
            <div style="margin-bottom:12px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Paciente</label>
                <select name="paciente_id" id="cita-paciente_id" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
                    <option value="">Seleccionar paciente...</option>
                </select>
            </div>
            <div style="margin-bottom:12px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Médico</label>
                <select name="medico_id" id="cita-medico_id" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
                    <option value="">Seleccionar médico...</option>
                </select>
            </div>
            <div style="margin-bottom:12px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Fecha y hora</label>
                <input type="datetime-local" name="fecha" id="cita-fecha" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
            </div>
            <div style="margin-bottom:12px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Motivo</label>
                <input type="text" name="motivo" id="cita-motivo" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
            </div>
            <div style="margin-bottom:12px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Estado</label>
                <select name="estado" id="cita-estado" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
                    <option value="Programada">Programada</option>
                    <option value="Confirmada">Confirmada</option>
                    <option value="Atendida">Atendida</option>
                    <option value="Cancelada">Cancelada</option>
                    <option value="No asistió">No asistió</option>
                </select>
            </div>
            <div style="margin-bottom:12px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Especialidad</label>
                <input type="text" name="especialidad" id="cita-especialidad" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" id="btn-guardar-cita" class="btn btn-primary" style="flex:1;">Guardar</button>
                <button type="button" id="btn-cancelar-cita" class="btn btn-danger" style="flex:0;">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Variables globales para listas de pacientes y médicos
    let pacientesList = [];
    let medicosList = [];

    // ============================================================
    // 0. Cargar pacientes y médicos para los selects
    // ============================================================
    function cargarSelects() {
        return Promise.all([
            fetch('/pacientes/api').then(r => r.json()),
            fetch('/medicos/api').then(r => r.json())
        ]).then(([pacientes, medicos]) => {
            pacientesList = pacientes;
            medicosList = medicos;
            // Llenar selects
            const selPac = document.getElementById('cita-paciente_id');
            selPac.innerHTML = '<option value="">Seleccionar paciente...</option>';
            pacientes.forEach(p => {
                selPac.innerHTML += `<option value="${p._id}">${p.nombre} ${p.apellidos}</option>`;
            });

            const selMed = document.getElementById('cita-medico_id');
            selMed.innerHTML = '<option value="">Seleccionar médico...</option>';
            medicos.forEach(m => {
                selMed.innerHTML += `<option value="${m._id}">${m.nombre} ${m.apellidos} - ${m.especialidad}</option>`;
            });
        });
    }

    // ============================================================
    // 1. Cargar listado de citas
    // ============================================================
    function cargarCitas() {
        fetch('/citas/api')
            .then(r => r.json())
            .then(data => {
                if (data.length === 0) {
                    document.getElementById('citas-list').innerHTML = '<p style="color:#999;">No hay citas registradas.</p>';
                    return;
                }
                let html = `
                    <table style="width:100%; border-collapse:collapse; margin-top:10px;">
                        <thead>
                            <tr style="background:#1a3e60; color:white;">
                                <th style="border:1px solid #ddd; padding:10px; text-align:left;">Paciente</th>
                                <th style="border:1px solid #ddd; padding:10px; text-align:left;">Médico</th>
                                <th style="border:1px solid #ddd; padding:10px; text-align:left;">Fecha</th>
                                <th style="border:1px solid #ddd; padding:10px; text-align:left;">Estado</th>
                                <th style="border:1px solid #ddd; padding:10px; text-align:left;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                data.forEach(c => {
                    // Buscar nombre del paciente y médico (si están en las listas)
                    const paciente = pacientesList.find(p => p._id === c.paciente_id);
                    const medico = medicosList.find(m => m._id === c.medico_id);
                    const nomPac = paciente ? `${paciente.nombre} ${paciente.apellidos}` : 'Desconocido';
                    const nomMed = medico ? `${medico.nombre} ${medico.apellidos}` : 'Desconocido';
                    const fecha = new Date(c.fecha).toLocaleString();

                    html += `
                        <tr>
                            <td style="border:1px solid #ddd; padding:10px;">${nomPac}</td>
                            <td style="border:1px solid #ddd; padding:10px;">${nomMed}</td>
                            <td style="border:1px solid #ddd; padding:10px;">${fecha}</td>
                            <td style="border:1px solid #ddd; padding:10px;">${c.estado}</td>
                            <td style="border:1px solid #ddd; padding:10px;">
                                <button onclick="editarCita('${c._id}')" class="btn-accion" style="background:#ffc107; color:#333;">Editar</button>
                                <button onclick="eliminarCita('${c._id}')" class="btn-accion" style="background:#dc3545; color:white;">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });
                html += `</tbody></table>`;
                document.getElementById('citas-list').innerHTML = html;
            })
            .catch(err => {
                console.error('Error al cargar citas:', err);
                document.getElementById('citas-list').innerHTML = '<p style="color:red;">Error al cargar citas.</p>';
            });
    }

    // ============================================================
    // 2. Abrir modal
    // ============================================================
    function abrirModalCita(titulo, datos = null) {
        document.getElementById('modal-titulo-cita').textContent = titulo;
        document.getElementById('modal-cita').style.display = 'flex';
        if (datos) {
            document.getElementById('cita-id').value = datos._id || '';
            document.getElementById('cita-paciente_id').value = datos.paciente_id || '';
            document.getElementById('cita-medico_id').value = datos.medico_id || '';
            // Formatear fecha para input datetime-local
            if (datos.fecha) {
                const fechaObj = new Date(datos.fecha);
                const iso = fechaObj.toISOString().slice(0, 16);
                document.getElementById('cita-fecha').value = iso;
            }
            document.getElementById('cita-motivo').value = datos.motivo || '';
            document.getElementById('cita-estado').value = datos.estado || 'Programada';
            document.getElementById('cita-especialidad').value = datos.especialidad || '';
        } else {
            document.getElementById('form-cita').reset();
            document.getElementById('cita-id').value = '';
            document.getElementById('cita-estado').value = 'Programada';
        }
    }

    function cerrarModalCita() {
        document.getElementById('modal-cita').style.display = 'none';
    }

    // ============================================================
    // 3. Guardar
    // ============================================================
    document.getElementById('form-cita').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('cita-id').value;
        const url = id ? `/citas/api/${id}` : '/citas/api';
        const method = id ? 'PUT' : 'POST';

        const data = {
            paciente_id: document.getElementById('cita-paciente_id').value,
            medico_id: document.getElementById('cita-medico_id').value,
            fecha: document.getElementById('cita-fecha').value,
            motivo: document.getElementById('cita-motivo').value.trim(),
            estado: document.getElementById('cita-estado').value,
            especialidad: document.getElementById('cita-especialidad').value.trim()
        };

        const btn = document.getElementById('btn-guardar-cita');
        btn.disabled = true;
        btn.textContent = 'Guardando...';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(r => {
            if (!r.ok) throw new Error('Error al guardar');
            return r.json();
        })
        .then(() => {
            cerrarModalCita();
            cargarCitas();
            alert(id ? 'Cita actualizada.' : 'Cita creada.');
        })
        .catch(err => {
            console.error('Error:', err);
            alert('Error al guardar la cita.');
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = 'Guardar';
        });
    });

    // ============================================================
    // 4. Editar
    // ============================================================
    function editarCita(id) {
        fetch(`/citas/api/${id}`)
            .then(r => r.json())
            .then(data => {
                abrirModalCita('Editar Cita', data);
            })
            .catch(err => {
                console.error('Error:', err);
                alert('No se pudo cargar la cita.');
            });
    }

    // ============================================================
    // 5. Eliminar
    // ============================================================
    function eliminarCita(id) {
        if (!confirm('¿Eliminar esta cita?')) return;
        fetch(`/citas/api/${id}`, { method: 'DELETE' })
            .then(r => {
                if (!r.ok) throw new Error('Error al eliminar');
                return r.json();
            })
            .then(() => {
                cargarCitas();
                alert('Cita eliminada.');
            })
            .catch(err => {
                console.error('Error:', err);
                alert('Error al eliminar la cita.');
            });
    }

    // ============================================================
    // 6. Eventos
    // ============================================================
    document.getElementById('btn-nuevo-cita').addEventListener('click', function() {
        abrirModalCita('Nueva Cita');
    });
    document.getElementById('btn-cancelar-cita').addEventListener('click', cerrarModalCita);
    document.getElementById('modal-cita').addEventListener('click', function(e) {
        if (e.target === this) cerrarModalCita();
    });

    // ============================================================
    // Inicializar: cargar selects, luego citas
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        cargarSelects().then(() => {
            cargarCitas();
        });
    });
</script>

<style>
    .btn { display:inline-block; padding:10px 20px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; text-decoration:none; color:white; font-size:14px; }
    .btn-success { background:#28a745; }
    .btn-success:hover { background:#218838; }
    .btn-primary { background:#1a3e60; }
    .btn-primary:hover { background:#2a5a7a; }
    .btn-danger { background:#dc3545; color:white; }
    .btn-danger:hover { background:#c82333; }
    .btn-accion { border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; margin-right:4px; }
    .btn-accion:hover { opacity:0.8; }
    label { font-weight:600; font-size:14px; }
    input, select, textarea { font-size:14px; }
</style>
{% endblock %}
